<!-- cabecera.component.html -->
<div class="bg-dark text-white shadow-sm py-3">
  <div class="container">
    <div class="d-flex flex-wrap align-items-center justify-content-between">

      <!-- Logo -->
      <a href="/" class="d-flex align-items-center text-white text-decoration-none">
        <img src="../../../../assets/Leanrcam.svg" width="90" height="90" alt="Home" class="me-2" />
        <span class="fs-4 fw-bold">Leanrcam</span>
      </a>

      <!-- 🔍 Barra de búsqueda -->
      <div class="flex-grow-1 mx-4" *ngIf="mostrarBarraBusqueda">
        <input
          type="text"
          class="form-control form-control-sm rounded-pill px-4"
          placeholder="Buscar en catálogo..."
          [(ngModel)]="terminoBusqueda"
          (input)="onBuscar()"
        />
      </div>

      <!-- 🔘 Menú de navegación -->
      <ul class="nav text-end">
        <li class="nav-item mx-2">
          <a href="#" class="nav-link text-white d-flex flex-column align-items-center">
            <img src="../../../../assets/home-button.png" width="24" height="24" alt="Home">
            <small>Inicio</small>
          </a>
        </li>
        <li class="nav-item mx-2">
          <a href="#" class="nav-link text-white d-flex flex-column align-items-center">
            <img src="../../../../assets/categories.png" width="24" height="24" alt="Categorías">
            <small>Categorías</small>
          </a>
        </li>
        <li class="nav-item mx-2">
          <a href="#" class="nav-link text-white d-flex flex-column align-items-center">
            <img src="../../../../assets/settings.png" width="24" height="24" alt="Ajustes">
            <small>Ajustes</small>
          </a>
        </li>
      </ul>
    </div>
  </div>
</div>
