<div class="bg-dark text-white shadow-sm py-3">
  <div class="container">
    <div class="d-flex flex-wrap align-items-center justify-content-between">

      <!-- Logo -->
      <a href="/" class="d-flex align-items-center text-white text-decoration-none">
        <img src="../../../../assets/Leanrcam.svg" width="90" height="90" alt="Home" class="me-2" />
        <span class="fs-4 fw-bold">Leanrcam</span>
      </a>

      <!-- 🔍 Barra de búsqueda -->
      <div class="flex-grow-1 mx-4" *ngIf="mostrarBarraBusqueda">
        <input
          type="text"
          class="form-control form-control-sm rounded-pill px-4"
          placeholder="Buscar en catálogo..."
          [(ngModel)]="terminoBusqueda"
          (input)="onBuscar()"
        />
      </div>

      <!-- 🔘 Menú de navegación -->
      <ul class="nav text-end align-items-center">
        <li class="nav-item mx-2">
          <a href="#" class="nav-link text-white d-flex flex-column align-items-center">
            <img src="../../../../assets/home-button.png" width="24" height="24" alt="Home">
            <small>Inicio</small>
          </a>
        </li>
        <li class="nav-item mx-2">
          <a href="historial" class="nav-link text-white d-flex flex-column align-items-center">
            <img src="../../../../assets/categories.png" width="24" height="24" alt="Categorías">
            <small>Historial</small>
          </a>
        </li>
        <li class="nav-item mx-2">
          <a href="#" class="nav-link text-white d-flex flex-column align-items-center">
            <img src="../../../../assets/settings.png" width="24" height="24" alt="Ajustes">
            <small>Ajustes</small>
          </a>
        </li>

        <!-- Perfil de usuario con dropdown -->
        <li class="nav-item mx-2 dropdown" *ngIf="userName">
          <a class="nav-link dropdown-toggle p-0 d-flex align-items-center justify-content-center"
             href="#" role="button" id="dropdownUserMenu"
             data-bs-toggle="dropdown" aria-expanded="false">
            <img [src]="userPhoto"
                 alt="Perfil"
                 width="40"
                 height="40"
                 class="rounded-circle border border-2 border-light shadow-sm"
                 style="object-fit: cover;">
            <span class="ms-2 fw-semibold text-white d-none d-md-inline">{{ userName }}</span>
          </a>

          <ul class="dropdown-menu dropdown-menu-end text-center mt-2" aria-labelledby="dropdownUserMenu">
            <li>
              <button class="dropdown-item text-danger" (click)="logout()">
                <i class="bi bi-box-arrow-right me-2"></i> Cerrar sesión
              </button>
            </li>
          </ul>
        </li>

        <!-- Si no hay usuario, muestra solo el ícono de perfil (redirige a login) -->
        <li class="nav-item mx-2" *ngIf="!userName">
          <a href="/login" class="nav-link p-0 d-flex align-items-center justify-content-center">
            <img src="../../../../assets/perfil.png"
                 alt="Perfil"
                 width="40"
                 height="40"
                 class="rounded-circle border border-2 border-light shadow-sm"
                 style="object-fit: cover;">
          </a>
        </li>

      </ul>
    </div>
  </div>
</div>
