<section class="vh-100 d-flex align-items-center justify-content-center" style="background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-10">
          <div class="card shadow-lg border-0" style="border-radius: 20px;">
            <div class="card-body p-5">
              <div class="row align-items-center">
                
                <!-- Formulario -->
                <div class="col-lg-6">
                  <h2 class="text-center fw-bold mb-4">Crea tu cuenta</h2>
                  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" novalidate>
                    
                    <!-- Nombre -->
                    <div class="form-floating mb-3">
                      <input formControlName="name" type="text" class="form-control" id="name" placeholder="Tu nombre">
                      <label for="name">Tu nombre</label>
                      <div *ngIf="registerForm.get('name')!.touched && registerForm.get('name')!.invalid"
                           class="invalid-feedback d-block">Este campo es obligatorio.</div>
                    </div>
  
                    <!-- Email -->
                    <div class="form-floating mb-3">
                      <input formControlName="email" type="email" class="form-control" id="email" placeholder="Tu correo">
                      <label for="email">Tu correo</label>
                      <div *ngIf="registerForm.get('email')!.touched && registerForm.get('email')!.hasError('required')"
                           class="invalid-feedback d-block">Este campo es obligatorio.</div>
                      <div *ngIf="registerForm.get('email')!.touched && registerForm.get('email')!.hasError('email')"
                           class="invalid-feedback d-block">Introduce un correo válido.</div>
                    </div>
  
                    <!-- Contraseña -->
                    <div class="form-floating mb-2">
                      <input formControlName="password" type="password" class="form-control" id="password" placeholder="Contraseña">
                      <label for="password">Contraseña</label>
                      <div *ngIf="registerForm.get('password')!.touched && registerForm.get('password')!.hasError('passwordStrength')"
                           class="invalid-feedback d-block">
                        Debe tener al menos 8 caracteres, mayúsculas, números y símbolos.
                      </div>
                    </div>
                    <!-- Indicador de fuerza -->
                    <small class="d-block mb-1">{{ strengthText }}</small>
                    <div class="progress mb-4" style="height:6px;">
                      <div
                        class="progress-bar"
                        role="progressbar"
                        [style.width]="strengthPercent"
                        [ngClass]="strengthClass">
                      </div>
                    </div>
  
                    <!-- Confirmar contraseña -->
                    <div class="form-floating mb-3">
                      <input formControlName="confirmPassword" type="password" class="form-control" id="confirmPassword" placeholder="Repite tu contraseña">
                      <label for="confirmPassword">Repite tu contraseña</label>
                      <div *ngIf="registerForm.hasError('passwordMismatch') && registerForm.get('confirmPassword')!.touched"
                           class="invalid-feedback d-block">Las contraseñas no coinciden.</div>
                    </div>
  
                    <!-- Términos -->
                    <div class="form-check mb-4 text-center">
                      <input formControlName="terms" class="form-check-input" type="checkbox" id="terms">
                      <label class="form-check-label" for="terms">
                        Acepto los <a href="#" class="text-decoration-underline">Términos y condiciones</a>
                      </label>
                      <div *ngIf="registerForm.get('terms')!.touched && registerForm.get('terms')!.invalid"
                           class="invalid-feedback d-block">Debes aceptarlos.</div>
                    </div>
  
                    <!-- Botón -->
                    <div class="d-grid">
                      <button type="submit" class="btn btn-primary btn-lg rounded-pill">Registrarse</button>
                    </div>
                  </form>
                </div>
  
                <!-- Ilustración -->
                <div class="col-lg-6 text-center">
                  <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-registration/draw1.webp"
                       alt="Ilustración" class="img-fluid" style="max-height: 360px;">
                </div>
  
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>  
  </section>
