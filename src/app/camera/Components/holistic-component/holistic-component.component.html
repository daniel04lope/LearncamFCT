<video #video style="display: none;" autoplay></video>
<div class="camera-frame">
  <canvas #outputCanvas class="outputCanvas" width="1280px" height="720px"></canvas>
</div>
<div class="controls">
  <button class="control-button" (click)="toggleDetection()">{{ isDetecting ? 'Stop Detection' : 'Start Detection' }}</button>
</div>
<div class="status-indicator">
  <div class="status-dot"></div>
  <span>Live</span>
</div>
