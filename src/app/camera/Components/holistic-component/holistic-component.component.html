<div class="main-container">

<div *ngIf="isCameraLoading || !isDetecting" class="intro-wrap">
  <div class="scanlines"></div>
  <div class="noise"></div>
  <div class="noise noise-moving"></div>
  <div class="play" data-splitting>INICIANDO</div>

  <!-- Botón de Reanudar solo si ya cargó la cámara y está pausado -->
  <button *ngIf="!isCameraLoading && !isDetecting"
          class="control-button"
          (click)="toggleDetection()">
    Reanudar
  </button>
</div>

  <video #video style="display:none;" autoplay></video>
  
  <div class="camera-frame">
    <canvas #outputCanvas class="outputCanvas"></canvas>
  </div>

  <div class="instruction-panel" *ngIf="currentExercise.id !== 4 && !isCameraLoading">
    <div class="exercise-number">Ejercicio {{currentExercise.id}}/3</div>
    <div class="instruction-text">{{ instructionText }}</div>
    <div class="visual-aid">{{ visualAidText }}</div>
  </div>

  
  <div class="progress-bar-container" *ngIf="currentExercise.id !== 4">
    <div class="progress-bar" [style.width.%]="progress"></div>
    <div class="progress-text">{{ progress.toFixed(0) }}% Completado</div>
  </div>

  
  <div class="completion-overlay" *ngIf="currentExercise.id === 4">
    <div class="animation-container">
      <div class="confetti"></div>
      <div class="confetti"></div>
      <div class="confetti"></div>
    </div>
    <h2>¡Lección Completada!</h2>
    <p class="congrats">🎉 ¡Felicidades!</p>
    <p>Has completado todos los ejercicios</p>
    <p class="final-message">Buen trabajo 👏</p>
  </div>

  
  <div class="controls">
    <button class="control-button" 
            [class.paused]="!isDetecting" 
            (click)="toggleDetection()">
      {{ isDetecting ? 'Detener' : 'Comenzar' }}
    </button>
  </div>

  
  <div class="status-indicator">
    <div class="status-dot" [style.background]="isDetecting ? '#2ecc71' : '#e74c3c'"></div>
    <span>{{ isDetecting ? 'Activo' : 'Pausado' }}</span>
  </div>
