<section class="vh-100 position-relative overflow-hidden">
  <video autoplay muted loop class="bg-video">
    <source src="../../../../assets/videofondologin.mp4" type="video/mp4" />
    Tu navegador no soporta videos HTML5.
  </video>

  <div class="container py-5 h-100 position-relative z-1">
    <div class="row d-flex align-items-center justify-content-center h-100">
      <div class="col-md-6 col-lg-5">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()"
              class="p-4 rounded-4 shadow-lg bg-white" novalidate>

          <div *ngIf="firebaseErrorMessage" class="alert alert-danger mb-4">
            {{ firebaseErrorMessage }}
          </div>

          <div class="mb-4">
            <label for="email" class="form-label fw-semibold">Correo electrónico</label>
            <input type="email" id="email" class="form-control form-control-lg"
                   formControlName="email"
                   [ngClass]="{'is-invalid': loginForm.get('email')?.touched && loginForm.get('email')?.invalid}" />
            <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('required')" 
                 class="invalid-feedback">
              El correo es obligatorio.
            </div>
            <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('email')" 
                 class="invalid-feedback">
              Formato de correo inválido.
            </div>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label fw-semibold">Contraseña</label>
            <input type="password" id="password" class="form-control form-control-lg"
                   formControlName="password"
                   [ngClass]="{'is-invalid': loginForm.get('password')?.touched && loginForm.get('password')?.invalid}" />
            <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')" 
                 class="invalid-feedback">
              La contraseña es obligatoria.
            </div>
            <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('minlength')" 
                 class="invalid-feedback">
              Debe tener al menos 8 caracteres.
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
<a href="#" (click)="sendResetEmail($event)"  class="text-primary">
  ¿Has olvidado tu contraseña?
</a>


            <a href="registro" class="text-primary">No tienes cuenta? REGISTRATE</a>
          </div>

          <button type="submit" class="btn btn-primary btn-lg w-100 mb-3"
                  [disabled]="loading">
            {{ loading ? 'Cargando...' : 'Inicia sesión' }}
          </button>

          <div class="divider d-flex align-items-center my-4">
            <hr class="flex-grow-1 me-2" />
            <span class="text-muted">O</span>
            <hr class="flex-grow-1 ms-2" />
          </div>

          <button type="button" class="btn btn-lg w-100 mb-2"
                  style="background-color: #DB4437; color: #fff;"
                  (click)="loginWithGoogle()"
                  [disabled]="loading">
            <i class="fab fa-google me-2"></i> Continuar con Google
          </button>

          <button type="button" class="btn btn-lg w-100 mb-2"
                  style="background-color: #1DA1F2; color: #fff;"
                  (click)="loginWithTwitter()"
                  [disabled]="loading">
            <i class="fab fa-twitter me-2"></i> Continuar con Twitter
          </button>

          <div class="divider d-flex align-items-center my-4">
            <hr class="flex-grow-1 me-2" />
            <span class="text-muted">O continúa con</span>
            <hr class="flex-grow-1 ms-2" />
          </div>

          <button type="button" class="btn btn-lg w-100 mb-2 btn-outline-primary"
                  (click)="signInWithFacial()"
                  [disabled]="loading">
            <i class="bi bi-camera me-2"></i>Continuar con Reconocimiento Facial
          </button>
        </form>

        <div class="text-center mt-4" *ngIf="showVideoPreview">
          <video #videoPreview class="rounded-3 shadow" width="300" autoplay muted></video>
          <div class="mt-3">
            <button type="button" class="btn btn-sm btn-danger"
                    (click)="cancelFaceLogin()">
              <i class="bi bi-x-circle me-1"></i>Cancelar
            </button>
          </div>
          <small class="text-muted d-block mt-2">
            Asegúrate de tener buena iluminación y mirar directamente a la cámara
          </small>
        </div>

      </div>
    </div>
  </div>
</section>
