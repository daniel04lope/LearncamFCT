<!-- Sección completa con video de fondo y formulario -->
<section class="vh-100 position-relative overflow-hidden">

  <!--  Video de fondo -->
  <video autoplay muted loop class="bg-video">
    <source src="../../../../assets/videofondologin.mp4" type="video/mp4" />
    Tu navegador no soporta videos HTML5.
  </video>

  <!--  Contenido del formulario -->
  <div class="container py-5 h-100 position-relative z-1">
    <div class="row d-flex align-items-center justify-content-center h-100">
      <div class="col-md-6 col-lg-5">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="p-4 rounded-4 shadow-lg bg-white" novalidate>

          <div class="mb-4">
            <label for="email" class="form-label fw-semibold">Correo electrónico</label>
            <input type="email" id="email" class="form-control form-control-lg"
              formControlName="email"
              [ngClass]="{'is-invalid': email?.touched && email?.invalid}" />
            <div *ngIf="email?.touched && email?.invalid" class="invalid-feedback">
              <div *ngIf="email?.errors?.['required']">El correo es obligatorio.</div>
              <div *ngIf="email?.errors?.['email']">Formato de correo inválido.</div>
            </div>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label fw-semibold">Contraseña</label>
            <input type="password" id="password" class="form-control form-control-lg"
              formControlName="password"
              (input)="onPasswordInput()"
              [ngClass]="{'is-invalid': password?.touched && password?.invalid}" />
            <div *ngIf="password?.touched && password?.invalid" class="invalid-feedback">
              <div *ngIf="password?.errors?.['required']">La contraseña es obligatoria.</div>
              <div *ngIf="password?.errors?.['minlength']">Debe tener al menos 8 caracteres.</div>
              <div *ngIf="password?.errors?.['pattern']">
                Debe incluir mayúscula, minúscula, número y símbolo.
              </div>
            </div>
  
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <a href="#" class="text-primary">¿Has olvidado tu contraseña?</a>
          </div>
          
          <div class="d-flex justify-content-between align-items-center mb-4">
            <a href="registro" class="text-primary">¿No tienes cuenta? REGISTRATE</a>
          </div>

          <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">Inicia sesión</button>

          <button type="button" class="btn btn-outline-primary btn-lg w-100 mb-3">
            <i class="fas fa-face-smile me-2"></i> Inicia sesión con reconocimiento facial
          </button>

          <div class="divider d-flex align-items-center my-4">
            <hr class="flex-grow-1 me-2" />
            <span class="text-muted">O</span>
            <hr class="flex-grow-1 ms-2" />
          </div>

          <a class="btn btn-lg w-100 mb-2" style="background-color: #3b5998; color: #fff;" href="#">
            <i class="fab fa-facebook-f me-2"></i> Continuar con Facebook
          </a>

          <a class="btn btn-lg w-100" style="background-color: #55acee; color: #fff;" href="#">
            <i class="fab fa-twitter me-2"></i> Continuar con Twitter
          </a>

        </form>
      </div>
    </div>
  </div>
</section>
